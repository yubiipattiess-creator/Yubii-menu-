<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>Yubii Patties — Digital Menu</title>
<style>
:root{--bg:#080808;--card:#151515;--gold:#ffb71b;--cream:#fff6df;--muted:#aaa;--line:#30260e}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(8,8,8,.94);backdrop-filter:blur(12px);border-bottom:1px solid #252525}
.top{padding:16px 16px 12px;text-align:center}.logo{font-size:31px;font-weight:900;color:var(--gold);letter-spacing:-1px}.tag{font-size:12px;color:#ddd;letter-spacing:3px}.search{margin:0 16px 12px;display:flex;gap:8px}
.search input{width:100%;background:#181818;border:1px solid #333;color:white;border-radius:14px;padding:13px 15px;font-size:15px;outline:none}
.tabs{display:flex;overflow:auto;gap:8px;padding:0 16px 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;border:1px solid #3b321b;background:#141414;color:#ddd;border-radius:999px;padding:9px 14px}.tabs button.active{background:var(--gold);color:#111;border-color:var(--gold);font-weight:800}
.hero{margin:14px 16px 8px;border:1px solid #3a2c0d;border-radius:22px;padding:18px;background:linear-gradient(135deg,#17130a,#0e0e0e)}
.hero h1{margin:0 0 5px;font-size:25px}.hero p{margin:0;color:#cfcfcf;font-size:13px}.notice{margin-top:12px;color:var(--gold);font-size:12px;font-weight:700}
main{padding-bottom:100px}.section{padding:10px 16px}.section h2{font-size:22px;margin:15px 0 10px;color:var(--gold);display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid #282828;border-radius:17px;padding:12px;min-width:0}
.card h3{font-size:15px;margin:0 0 5px;line-height:1.2}.desc{font-size:11px;color:var(--muted);min-height:28px}.bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.price{font-weight:900;color:var(--gold);font-size:16px}.add{border:0;background:var(--gold);color:#111;font-weight:900;border-radius:11px;width:36px;height:34px;font-size:20px}
.badge{font-size:9px;border:1px solid var(--gold);color:var(--gold);border-radius:5px;padding:2px 5px;margin-left:4px}
.addons{background:#121212;border:1px solid #3b321b;border-radius:16px;padding:12px}.addon{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #292929;font-size:13px}.addon:last-child{border:0}
.cartbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:30;background:var(--gold);color:#111;border-radius:17px;padding:12px 14px;display:none;box-shadow:0 8px 30px #000;font-weight:900}
.cartbar.show{display:flex;justify-content:space-between;align-items:center}.cartbar small{display:block;font-weight:700}
.cartpanel{position:fixed;inset:0;z-index:40;background:#090909;display:none;overflow:auto}.cartpanel.open{display:block}
.carthead{position:sticky;top:0;background:#090909;padding:18px 16px;border-bottom:1px solid #252525;display:flex;justify-content:space-between;align-items:center}
.carthead h2{margin:0}.close{background:#222;color:white;border:0;border-radius:10px;padding:8px 11px}.cartitem{margin:10px 16px;background:#151515;border-radius:14px;padding:12px;display:flex;justify-content:space-between;gap:10px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border:0;border-radius:9px;background:#2a2a2a;color:#fff;font-size:17px}
.total{margin:18px 16px;padding:16px;background:#151515;border-radius:16px}.row{display:flex;justify-content:space-between;margin:7px 0}.grand{font-size:20px;font-weight:900;color:var(--gold);border-top:1px solid #333;padding-top:10px}
.order{width:100%;border:0;background:var(--gold);color:#111;border-radius:13px;padding:14px;font-weight:900;font-size:16px;margin-top:10px}
.empty{text-align:center;color:#aaa;padding:50px 20px}
@media(min-width:700px){body{max-width:700px;margin:auto}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
  <div class="top"><div class="logo">Yubii Patties</div><div class="tag">SIP • CRAVE • BITE</div></div>
  <div class="search"><input id="search" placeholder="Search your favourite item…"></div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div class="hero">
    <h1>Good Food. Happy Mood. ❤️</h1>
    <p>Freshly prepared sandwiches, burgers, patties, fries, shakes & desserts.</p>
    <div class="notice">⏱ You will receive your order in 10 to 15 minutes.</div>
  </div>
  <div id="menu"></div>
</main>

<div class="cartbar" id="cartbar" onclick="openCart()">
  <div><span id="cartCount">0</span> items<small>View your cart</small></div>
  <div>₹<span id="cartTotal">0</span> →</div>
</div>

<div class="cartpanel" id="cartpanel">
  <div class="carthead"><h2>Your Cart</h2><button class="close" onclick="closeCart()">✕</button></div>
  <div id="cartItems"></div>
  <div class="total" id="totalBox"></div>
</div>

<script>
const WHATSAPP_NUMBER = "917849913533"; // Put your WhatsApp number here, e.g. "919876543210"

const menu = [
 {name:"Sip Station",icon:"🥤",items:[
  ["Strawberry Shake",80],["Oreo Shake",100],["Cold Coffee With Icecream",70],["Cold Coffee",50]]},
 {name:"Sandwich",icon:"🥪",best:true,items:[
  ["Signature Yubii Sp. Jumbo",80],["Cheese Burst Sandwich",70],["Cheese Melt Paneer Sandwich",60],["Mumbai Magic Sandwich",50],
  ["Cheese Chilli Crunch",60],["Paneer Delight Sandwich",50],["Golden Corn Sandwich",50],["Veggies Delight",40]]},
 {name:"Burger",icon:"🍔",items:[
  ["Smokey Cheese Paneer Blast",60],["Smokey Paneer Burger",50],["Cheese Aloo Tikki Burger",50],["Crispy Veg Burger",40],["Classic Aloo Tikki Burger",30]]},
 {name:"Patties",icon:"🥟",best:true,items:[
  ["Pizza Puff",60],["Paneer Cheese Patties",50],["Smokey Cheese Patties",50],["Chilli Cheese Patties",50],["Cheese Patties",40],
  ["Tandoori Patties",30],["Chilli Garlic Patties",30],["Masala Cheese Patties",30],["Paneer Patties",20]]},
 {name:"Crispy Bite",icon:"🍟",items:[
  ["Fries Bowl",100],["Creamy Cheese Fries",80],["Peri Peri Fries",70],["Masala Fries",60],["Classic Fries",50],["Peri Peri Potato Shots",80]]},
 {name:"Sweet Craving",icon:"🍰",items:[
  ["Pastry",40],["Gulab Jamun With Icecream",60],["Gulab Jamun",30],["Cup Cake",60],["Hot Chocolate Brownies",90]]},
 {name:"Combo",icon:"🔥",items:[["Combo 99",99],["Combo 149",149],["Combo 199",199]]}
];

const addons=[["Extra Cheese",20],["Topping Any",10],["Extra Paneer",20],["Seasoning",10]];
let cart=[];

function money(n){return "₹"+n}
function renderTabs(){
  tabs.innerHTML='<button class="active" onclick="filterCat(\'all\',this)">All</button>'+
    menu.map((s,i)=>`<button onclick="filterCat(${i},this)">${s.icon} ${s.name}</button>`).join("");
}
function renderMenu(filter="all",query=""){
  const q=query.trim().toLowerCase();
  const sections=filter==="all"?menu:[menu[filter]];
  menuEl=document.getElementById("menu");
  let out="";
  sections.forEach((s)=>{
    const items=s.items.filter(x=>!q || x[0].toLowerCase().includes(q));
    if(!items.length)return;
    out+=`<section class="section"><h2>${s.icon} ${s.name}${s.best?'<span class="badge">BEST SELLER</span>':''}</h2><div class="grid">`;
    items.forEach(x=>out+=card(x));
    out+="</div></section>";
  });
  if(filter==="all"&&!q){
    out+=`<section class="section"><h2>➕ Add Ons</h2><div class="addons">${addons.map(a=>`<div class="addon"><span>${a[0]}</span><b>${money(a[1])}</b></div>`).join("")}</div></section>`;
  }
  menuEl.innerHTML=out||'<div class="empty">No item found 😕</div>';
}
function card(x){
 return `<article class="card"><h3>${x[0]}</h3><div class="desc">Freshly prepared & delicious.</div><div class="bottom"><span class="price">${money(x[1])}</span><button class="add" onclick='addToCart(${JSON.stringify(x[0])},${x[1]})'>+</button></div></article>`;
}
function filterCat(i,btn){
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");
 renderMenu(i,search.value);
}
function addToCart(name,price){
 const found=cart.find(x=>x.name===name); if(found)found.qty++; else cart.push({name,price,qty:1}); updateCart();
}
function updateCart(){
 const count=cart.reduce((a,x)=>a+x.qty,0), total=cart.reduce((a,x)=>a+x.qty*x.price,0);
 cartbar.classList.toggle("show",count>0);cartCount.textContent=count;cartTotal.textContent=total;renderCart();
}
function renderCart(){
 if(!cart.length){cartItems.innerHTML='<div class="empty">Your cart is empty.</div>';totalBox.innerHTML="";return}
 cartItems.innerHTML=cart.map((x,i)=>`<div class="cartitem"><div><b>${x.name}</b><div style="color:#aaa">${money(x.price)} each</div></div><div class="qty"><button onclick="changeQty(${i},-1)">−</button><b>${x.qty}</b><button onclick="changeQty(${i},1)">+</button></div></div>`).join("");
 const total=cart.reduce((a,x)=>a+x.qty*x.price,0);
 totalBox.innerHTML=`<div class="row"><span>Subtotal</span><b>${money(total)}</b></div><div class="row grand"><span>Total</span><b>${money(total)}</b></div><button class="order" onclick="orderWhatsApp()">Order on WhatsApp</button><div style="font-size:11px;color:#888;margin-top:9px">Replace the WhatsApp number in the code before publishing.</div>`;
}
function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);updateCart()}
function openCart(){cartpanel.classList.add("open");renderCart()}
function closeCart(){cartpanel.classList.remove("open")}
function orderWhatsApp(){
 const total=cart.reduce((a,x)=>a+x.qty*x.price,0);
 const lines=cart.map(x=>`${x.name} x${x.qty} = ₹${x.price*x.qty}`).join("\n");
 const msg=`Hello Yubii Patties!%0A%0AOrder:%0A${encodeURIComponent(lines)}%0A%0ATotal: ₹${total}%0A%0AThank you!`;
 if(!WHATSAPP_NUMBER){alert("Add your WhatsApp number in the WHATSAPP_NUMBER variable in this HTML file.");return}
 location.href=`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;
}
search.addEventListener("input",()=>renderMenu("all",search.value));
renderTabs();renderMenu();
</script>
</body>
</html>
